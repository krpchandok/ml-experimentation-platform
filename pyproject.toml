[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlplat"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.optional-dependencies]
mlflow = ["mlflow"]
dashboard = ["streamlit>=1.50", "plotly>=5.15", "pandas"]
examples = ["torch", "torchvision", "numpy"]
test = ["pytest"]

[project.scripts]
mlplat = "mlplat.cli:main"

[tool.setuptools.packages.find]
include = ["mlplat"]
