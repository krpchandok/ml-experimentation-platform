bundle:
  name: ml-experimentation-platform

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    etl_iris:
      name: ml-platform-etl-iris
      tasks:
        - task_key: run_etl
          spark_python_task:
            python_file: ./src/etl/run.py
            parameters: ["--spec", "./configs/datasets/iris.yaml", "--catalog", "workspace", "--schema", "ml_platform"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: []
